version: 1

# 国务院办公厅节假日安排。日期一律加引号，避免 YAML 把它们解析成时间戳。
#
# 没公布的年份故意不写在这里。那种年份会退回普通的「周六周日就是休息」判断，
# 这是安全的失效方式：调休还没公布就去猜，会让她整个日程错得很笃定，比不知道更糟。
#
# 数据源：国务院办公厅关于部分节假日安排的通知。
years:
  2025:
    holidays:
      - { name: 元旦, start: "2025-01-01", end: "2025-01-01" }
      - { name: 春节, start: "2025-01-28", end: "2025-02-04" }
      - { name: 清明节, start: "2025-04-04", end: "2025-04-06" }
      - { name: 劳动节, start: "2025-05-01", end: "2025-05-05" }
      - { name: 端午节, start: "2025-05-31", end: "2025-06-02" }
      - { name: 国庆节、中秋节, start: "2025-10-01", end: "2025-10-08" }
    makeup:
      - "2025-01-26"
      - "2025-02-08"
      - "2025-04-27"
      - "2025-09-28"
      - "2025-10-11"
    eves:
      - { date: "2025-01-28", name: 除夕 }
      - { date: "2025-12-31", name: 跨年夜 }
  2026:
    holidays:
      - { name: 元旦, start: "2026-01-01", end: "2026-01-03" }
      - { name: 春节, start: "2026-02-15", end: "2026-02-23" }
      - { name: 清明节, start: "2026-04-04", end: "2026-04-06" }
      - { name: 劳动节, start: "2026-05-01", end: "2026-05-05" }
      - { name: 端午节, start: "2026-06-19", end: "2026-06-21" }
      - { name: 中秋节, start: "2026-09-25", end: "2026-09-27" }
      - { name: 国庆节, start: "2026-10-01", end: "2026-10-07" }
    makeup:
      - "2026-01-04"
      - "2026-02-14"
      - "2026-02-28"
      - "2026-05-09"
      - "2026-09-20"
      - "2026-10-10"
    eves:
      - { date: "2026-02-16", name: 除夕 }
      - { date: "2026-12-31", name: 跨年夜 }

# 日子怎么拨她的生物钟，单位分钟，在每日 jitter 之前叠加。
# 假期头一天最松，往后逐日收敛；调休补班反而更惨，闹钟得更早。
sleep_shift:
  workday: { wake: 0, sleep: 0 }
  weekend: { wake: 75, sleep: 30 }
  makeup: { wake: -20, sleep: -15 }
  holiday_first: { wake: 90, sleep: 45 }
  holiday_later: { wake: 45, sleep: 25 }
  eve: { wake: 45, sleep: 90 }

# 情绪走现有 ActiveEffect，数值写在这里而不是硬编码在 Go 里。
# SourceRuleID 带日期，mergeEffects 按 (source, target) 去重，跨 tick 不叠加。
mood:
  holiday:
    - { target: moodValence, baselineDelta: 8, duration: 24h }
    - { target: stress, baselineDelta: -6, duration: 24h }
  makeup:
    - { target: irritability, baselineDelta: 12, duration: 24h }
    - { target: motivation, baselineDelta: -10, duration: 24h }
    - { target: stress, baselineDelta: 8, duration: 24h }
  holiday_last:
    - { target: anxiety, baselineDelta: 8, duration: 24h, curve: ramp }
    - { target: moodValence, baselineDelta: -6, duration: 24h, curve: ramp }
